name: Run benchmarks
on:
  push:
    branches:
      - benchmark  # TODO set to master when deploying

permissions:
  contents: write
  deployments: write

jobs:
  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-latest  # TODO runs-on: self-hosted
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v2
      - name: Setup python
        uses: actions/setup-python@v2
        with:
          python-version: 3.8
      - name: Build Firedrake
        run: |
          cd ..
          ./firedrake/scripts/firedrake-install --venv-name build --disable-ssh --minimal-petsc || (cat firedrake-install.log && /bin/false)
      - name: Install benchmark dependencies
        run: |
          . ../build/bin/activate
          python -m pip install pytest pytest-benchmark
      - name: Run benchmarks
        run: |
          cd ..  # so we don't use the wrong Firedrake
          . build/bin/activate
          python -m pytest --benchmark-only --benchmark-json firedrake/output.json --verbose firedrake/{benchmarks,tests}
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Python Benchmark with pytest-benchmark
          tool: 'pytest'
          output-file-path: output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Show alert with commit comment on detecting possible performance regression
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@connorjward'
